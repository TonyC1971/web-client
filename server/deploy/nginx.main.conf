# Override of /etc/nginx/nginx.conf in the brotli-enabled image
# (server/deploy/nginx.Dockerfile). Mostly mirrors nginx:alpine's
# default, with two additions:
#   1. load_module for the brotli static filter (must be top-level).
#   2. brotli_static on / brotli_types in the http context.
# Site-specific config (server { ... } blocks) still lives in
# /etc/nginx/conf.d/*.conf, mounted by docker-compose.
load_module modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_brotli_filter_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    # v0.3.27 (500-user scale): bumped from 1024 to 2048 per worker
    # (×2 of upstream default, conservative for the test NAS). With
    # worker_processes=auto on a multi-core NAS this gives ~4-8k
    # connection budget total. Each WS session uses 1 worker
    # connection on the listen socket and 1 for the upstream proxy —
    # so 500 concurrent web players is ~1000 worker connections,
    # within budget for the test deploy. Bump to 4096 per worker
    # if scaling beyond 500 concurrent.
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Don't leak the nginx version in Server: response headers or 4xx/5xx pages.
    server_tokens off;

    # v0.3.27 (1000-user scale): real-IP extraction. Without this nginx
    # sees `$binary_remote_addr` as the cloudflared tunnel container's
    # internal IP (a single value for ALL real users), so the per-IP
    # rate-limit zones below would bucket every user into the same
    # bucket — capping the deploy at ~4 concurrent web players
    # regardless of how many distinct real users were trying.
    #
    # `set_real_ip_from` lists the IP ranges nginx should TRUST to
    # forward correct CF-Connecting-IP headers:
    #   - Cloudflare's published IPv4 + IPv6 ranges
    #     (https://www.cloudflare.com/ips/, refresh periodically)
    #   - Docker bridge / private RFC1918 ranges where cloudflared
    #     and the LAN reach nginx from inside the host network
    # `real_ip_header CF-Connecting-IP` — Cloudflare always sets this
    # to the original visitor IP, regardless of the upstream chain.
    # `real_ip_recursive on` — walk back through nested forwarders
    # so `$remote_addr` is consistently the visitor, not any hop.
    #
    # After this, every `limit_req_zone $binary_remote_addr ...` and
    # `limit_conn_zone $binary_remote_addr ...` below buckets per
    # real user IP, NOT per upstream tunnel IP.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # Local docker bridge / RFC1918 (cloudflared tunnel runs on the
    # docker network; LAN-direct test traffic comes from the host).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1/32;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Slowloris defence: bound the time clients have to send the request
    # headers / body and the time the server takes to send the response.
    # The 10s ceiling is generous for normal clients and tight enough that
    # a stalled connection can't pin a worker slot for hours.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;

    # Per-IP / per-route rate-limit zones, declared here so any server{}
    # block can pull them in via limit_req / limit_conn. Sized at 10 MB
    # (~160 000 IPs tracked) which is plenty for the demo deploy.
    limit_req_zone  $binary_remote_addr zone=auth_zone:10m  rate=5r/s;
    limit_req_zone  $binary_remote_addr zone=api_zone:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=batch_zone:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

    # Static brotli serving — when a request matches a file F and a
    # sibling F.br exists, serve the .br with Content-Encoding: br
    # (provided the client's Accept-Encoding includes br, which all
    # modern browsers do). The on-the-fly brotli_filter is left off
    # because the gamefiles are precomputed and CSS/JS are already
    # tiny + fingerprinted.
    brotli_static on;
    # Compression types only matter if brotli_filter is on (it isn't
    # here), but listing them keeps the config self-documenting and
    # ready for a future toggle.
    brotli_types
        application/octet-stream
        application/javascript
        application/json
        application/wasm
        application/xml
        text/css
        text/html
        text/plain;

    include /etc/nginx/conf.d/*.conf;
}
